#
# LMS Platform JMeter User Properties
# This file overrides settings from jmeter.properties
#

#---------------------------------------------------------------------------
# UI Scaling - Increase interface size for better visibility
#---------------------------------------------------------------------------
sun.java2d.uiScale=2.0

# Alternative scaling options for different systems:
# swing.scale=2.0
# awt.toolkit=sun.awt.X11.XToolkit

#---------------------------------------------------------------------------
# Look and Feel - Modern dark theme
#---------------------------------------------------------------------------
jmeter.laf=javax.swing.plaf.metal.MetalLookAndFeel

#---------------------------------------------------------------------------
# Memory Settings
#---------------------------------------------------------------------------
heap.max=2048m
heap.min=512m

#---------------------------------------------------------------------------
# Test Plan Defaults
#---------------------------------------------------------------------------
# Default timeout for HTTP requests
httpclient.timeout=30000

# Encoding
sampleresult.default.encoding=UTF-8

#---------------------------------------------------------------------------
# Logging Level
#---------------------------------------------------------------------------
log_level.jmeter=INFO
log_level.jmeter.engine=WARN
log_level.jmeter.threads=INFO
log_level.jmeter.gui=WARN
