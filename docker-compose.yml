version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-platform-postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my-safe-password-2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-platform-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/mydatabase?ssl=false&sslmode=disable&useSSL=false
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-my-safe-password-2026}
      SPRING_PROFILES_ACTIVE: prod
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:

networks:
  lms-network:
    driver: bridge
