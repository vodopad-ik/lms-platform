spring.application.name=lms-platform
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/mydatabase?sslmode=disable
spring.datasource.username=myuser
spring.datasource.password=${DB_PASSWORD:my-safe-password-2026}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_queries=false
spring.jpa.properties.hibernate.query.substitutions=true
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
app.seed.enabled=true

spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=start_only
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# CORS configuration - allow specific origins for development
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
